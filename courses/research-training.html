<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>科研训练与写作 · 答疑讨论 — 何洪津</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">
    <header class="course-header">
        <a class="back-link" href="../index.html#cn-teaching">← 返回主页</a>
        <h1>科研训练与写作</h1>
        <p class="course-sub">Research Training &amp; Writing · 答疑讨论区</p>
    </header>

    <!-- 密码门 -->
    <div id="gate" class="gate">
        <div class="gate-card">
            <div class="gate-icon">🔒</div>
            <h2>课程答疑讨论区</h2>
            <p class="gate-hint">请输入访问密码以查看讨论内容与课件</p>
            <form id="gate-form" autocomplete="off">
                <input type="password" id="gate-input" placeholder="请输入密码" />
                <button type="submit">解锁</button>
            </form>
            <p id="gate-error" class="gate-error">密码错误，请重试</p>
        </div>
    </div>

    <!-- 解锁后内容 -->
    <div id="content" class="content" hidden>
        <!-- 课件资料 -->
        <div class="materials">
            <h3>📚 课件资料</h3>
            <p class="materials-hint">点击课件在线查看（本页密码解锁后可见，课件已加密、不可下载）</p>
            <ul class="material-list">
                <li>
                    <button class="material-item" data-pdf="assets/Intro_Comp_Math.pdf" data-title="计算数学导论（Intro_Comp_Math.pdf）">
                        <span class="mi-index">1</span>
                        <span class="mi-icon">📄</span>
                        <span class="mi-name">计算数学导论</span>
                        <span class="mi-file">Intro_Comp_Math.pdf</span>
                        <span class="mi-meta">74 页</span>
                        <span class="mi-action">查看 ›</span>
                    </button>
                </li>
                <li>
                    <button class="material-item" data-pdf="assets/Research_Writing.pdf" data-title="科研写作（Research_Writing.pdf）">
                        <span class="mi-index">2</span>
                        <span class="mi-icon">📄</span>
                        <span class="mi-name">科研写作</span>
                        <span class="mi-file">Research_Writing.pdf</span>
                        <span class="mi-meta">51 页</span>
                        <span class="mi-action">查看 ›</span>
                    </button>
                </li>
            </ul>
        </div>

        <!-- 答疑讨论 -->
        <div class="notice">
            <h2>💬 答疑讨论</h2>
            <p>本课程的疑问请在下方留言，我会定期回复；也可通过邮件或到办公室咨询。</p>
            <p class="contact">📧 <a href="mailto:hehongjin@nbu.edu.cn">hehongjin@nbu.edu.cn</a> · 🏫 宁波大学数学与统计学院包玉书楼306-2室</p>
        </div>
        <div id="giscus"></div>
    </div>
</div>

<!-- PDF 查看器 -->
<div id="pdf-viewer" class="pdf-viewer" hidden>
    <div class="pdf-toolbar">
        <span class="pdf-title" id="pdf-title"></span>
        <button id="pdf-prev">‹ 上一页</button>
        <span id="pdf-page">0 / 0</span>
        <button id="pdf-next">下一页 ›</button>
        <button id="pdf-close">✕</button>
    </div>
    <div class="pdf-canvas-wrap" id="pdf-canvas-wrap">
        <canvas id="pdf-canvas"></canvas>
    </div>
</div>

<script src="config.js"></script>
<script>window.QA_CONFIG.giscus.term = '科研训练与写作';</script>
<script src="lib/pdfjs/pdf.min.js"></script>
<script src="pdf-viewer.js"></script>
<script src="gate.js"></script>
</body>
</html>
